ekf_filter_node:
  ros__parameters:
    # frames
    map_frame:        utm
    odom_frame:       odom
    base_link_frame:  base_link
    world_frame:      utm

    # measurement sources
    odom0:            /odom_imu
    odom0_config:     [true, true, false,
                       false, false, false,
                       false, false, true,
                       false, false, false,
                       false, false, false]
    odom0_queue_size: 10

    # do_2d and TF
    two_d_mode:       true
    publish_tf:       true

    # filter parameters
    frequency:        30.0
    sensor_timeout:   0.1
